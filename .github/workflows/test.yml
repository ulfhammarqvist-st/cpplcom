name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - run: pip install clang==19.1.7
      # The tests skip without clang++, so make sure that is not why they pass.
      - run: clang++ --version
      - run: python -m unittest -v
